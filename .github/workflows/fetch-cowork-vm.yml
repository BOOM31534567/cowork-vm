name: fetch-cowork-vm-bundle

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 下载并校验
        run: |
          set -euo pipefail
          B=https://downloads.claude.ai/vms/linux/x64/2a762adfc2eea13eca0d113a2e6452ff00ae3f62
          mkdir -p payload && cd payload
          for f in rootfs.vhdx.zst vmlinuz.zst initrd.zst; do
            echo ">>> $f"
            curl -fL --retry 8 --retry-delay 5 --retry-all-errors -C - -o "$f" "$B/$f"
            ls -l "$f"
          done
          echo "90066a2ab3b7b406db53ba3d9e95168aeadab788d921a94bc00e94b6f1950d98  rootfs.vhdx.zst" > SHA256SUMS.txt
          echo "8c74da17c86a7efad89b43fd0d11235dc257b13a7f56b2fdd3677d3fe3562a3e  vmlinuz.zst"     >> SHA256SUMS.txt
          echo "6bf448d34e72d8c0bbda9c32eb3589e2b602b6c780df6880212e2cf7a778fa34  initrd.zst"      >> SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: 发布为 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd payload
          gh release create cowork-vm-2a762adf --title "Cowork VM bundle 2a762adf" \
            --notes "由 GitHub Actions 从 downloads.claude.ai 抓取并逐字节校验" \
            rootfs.vhdx.zst vmlinuz.zst initrd.zst SHA256SUMS.txt \
          || gh release upload cowork-vm-2a762adf rootfs.vhdx.zst vmlinuz.zst initrd.zst SHA256SUMS.txt --clobber

